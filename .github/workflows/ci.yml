name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:service-role-boundary
      - run: npm run lint
      - run: npm run test
      - run: npm run test:integration
        env:
          INTEGRATION_REQUIRED: "1"
          INTEGRATION_SUPABASE_URL: ${{ secrets.INTEGRATION_SUPABASE_URL }}
          INTEGRATION_SUPABASE_ANON_KEY: ${{ secrets.INTEGRATION_SUPABASE_ANON_KEY }}
          INTEGRATION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.INTEGRATION_SUPABASE_SERVICE_ROLE_KEY }}
          INTEGRATION_CI_USER_PASSWORD: ${{ secrets.INTEGRATION_CI_USER_PASSWORD }}
          INTEGRATION_BASE_URL: ${{ secrets.INTEGRATION_BASE_URL }}
          INTEGRATION_PUBLIC_TENANT_BASE_URL: ${{ secrets.INTEGRATION_PUBLIC_TENANT_BASE_URL }}
          INTEGRATION_TEST_DATE: ${{ secrets.INTEGRATION_TEST_DATE }}
          INTEGRATION_TENANT_A_SLUG: ${{ secrets.INTEGRATION_TENANT_A_SLUG }}
          INTEGRATION_TENANT_B_SLUG: ${{ secrets.INTEGRATION_TENANT_B_SLUG }}
          INTEGRATION_TENANT_B_CLIENT_ID: ${{ secrets.INTEGRATION_TENANT_B_CLIENT_ID }}
          INTEGRATION_TENANT_B_BOOKING_ID: ${{ secrets.INTEGRATION_TENANT_B_BOOKING_ID }}
          INTEGRATION_STORAGE_BUCKET: ${{ secrets.INTEGRATION_STORAGE_BUCKET }}
      - run: npm run build

